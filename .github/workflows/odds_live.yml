name: odds-live

on:
  schedule:
    # JST 9:00 (土日) 1本目
    - cron: '0 0 * * 6,0'
    # JST 14:35 (土日) 2本目（6時間制限のリレー）
    - cron: '35 5 * * 6,0'
  workflow_dispatch:

concurrency:
  group: odds-live
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 selenium webdriver-manager

      - name: Git config
        run: |
          git config user.name "odds-bot"
          git config user.email "bot@umayomi"

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scrape_odds_live.py
