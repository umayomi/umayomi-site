name: odds-live

on:
  schedule:
    # 混雑遅延対策の多段起動（JST 土日 7:00 / 8:30 / 9:30 / 11:30 / 14:35）
    - cron: '0 22 * * 5,6'    # JST 7:00
    - cron: '30 23 * * 5,6'   # JST 8:30
    - cron: '30 0 * * 6,0'    # JST 9:30
    - cron: '30 2 * * 6,0'    # JST 11:30
    - cron: '35 5 * * 6,0'    # JST 14:35
  workflow_dispatch:

concurrency:
  group: odds-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 selenium webdriver-manager

      - name: Git config
        run: |
          git config user.name "odds-bot"
          git config user.email "bot@umayomi"

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scrape_odds_live.py
