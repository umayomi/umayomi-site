name: Scrape umarengod (weekly)

on:
  schedule:
    # 毎週金曜午前0時(UTC) = 金曜午前9時(JST)
    - cron: '0 0 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 webdriver-manager
      
      - name: Run umarengod scraper
        run: python scripts/scrape_umarengod.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/umarengod_stats.json data/screenshots_umarengod/ || true
          git diff --staged --quiet || git commit -m "Auto-update umarengod stats $(date -u +%Y-%m-%d)"
          git push
